name: requestflow-app

topology:
  nodes:
    user-client:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip address replace 10.10.10.21/24 dev eth1
        - ip route replace 10.10.30.0/24 via 10.10.10.1 dev eth1
        - sh -c 'grep -q "requestflow.local" /etc/hosts || echo "10.10.30.10 requestflow.local" >> /etc/hosts'

    admin-client:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip address replace 10.10.20.21/24 dev eth1
        - ip route replace 10.10.30.0/24 via 10.10.20.1 dev eth1
        - sh -c 'grep -q "requestflow.local" /etc/hosts || echo "10.10.30.10 requestflow.local" >> /etc/hosts'

    router:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - ip address replace 10.10.10.1/24 dev eth1
        - ip address replace 10.10.30.1/24 dev eth2
        - ip address replace 10.10.20.1/24 dev eth3

    requestflow-net-frontend:
      kind: ext-container
      exec:
        - ip address replace 10.10.30.10/24 dev eth1
        - ip route replace 10.10.10.0/24 via 10.10.30.1 dev eth1
        - ip route replace 10.10.20.0/24 via 10.10.30.1 dev eth1

  links:
    - endpoints:
        - user-client:eth1
        - router:eth1

    - endpoints:
        - router:eth2
        - requestflow-net-frontend:eth1

    - endpoints:
        - admin-client:eth1
        - router:eth3
